<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links da Mari | Vitrine Oficial de Produtos</title>
  <meta name="description" content="Seleção especial dos produtos exclusivos e indicações da Mari. Clique nos links abaixo para garantir o seu!">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-primary: #fdfbf9;
      --bg-secondary: #f6efe9;
      --bg-card: #ffffff;
      --text-primary: #2d1e1b;
      --text-secondary: #6e5954;
      --text-muted: #9e8782;
      --accent: #b85d4e;
      --accent-hover: #9f493b;
      --accent-soft: #f9ebe8;
      --gold: #c99d66;
      --gold-soft: #faf3ea;
      --border: #ebe0da;
      --shadow-sm: 0 2px 8px rgba(45, 30, 27, 0.05);
      --shadow-md: 0 8px 24px rgba(45, 30, 27, 0.08);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(184, 93, 78, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(201, 157, 102, 0.09) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 64px;
    }

    /* Main Container */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 44px 20px 24px;
    }

    /* Profile Header */
    .profile-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar-wrapper {
      width: 112px;
      height: 112px;
      margin: 0 auto 16px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg-card);
      box-shadow: var(--shadow-md), 0 0 0 2px var(--accent);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.75rem;
      font-weight: 700;
      color: var(--accent);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.35rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .profile-bio {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Search & Category Filters */
    .controls-section {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-box {
      position: relative;
    }

    .search-box i, .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.92rem;
      color: var(--text-primary);
      font-family: inherit;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184, 93, 78, 0.12);
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      padding: 7px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      font-family: inherit;
    }

    .cat-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .cat-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Products List */
    .products-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #dccbc3;
    }

    .product-card.featured {
      border: 1.5px solid var(--gold);
      background: linear-gradient(to right, #ffffff, #fffdf9);
    }

    .product-thumb {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .product-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-featured {
      position: absolute;
      top: 12px;
      right: 14px;
      background: var(--gold-soft);
      color: #966c36;
      border: 1px solid rgba(201, 157, 102, 0.35);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .product-content {
      flex: 1;
      min-width: 0;
    }

    .product-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .product-cat {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .product-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      padding-right: 90px;
      line-height: 1.3;
    }

    .product-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .price-current {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .price-old {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .product-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-buy {
      background: var(--accent);
      color: #fff;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(184, 93, 78, 0.22);
    }

    .btn-buy:hover {
      background: var(--accent-hover);
      transform: translateX(2px);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .icon-sm {
      width: 16px;
      height: 16px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 24px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    /* Footer */
    .page-footer {
      text-align: center;
      margin-top: 48px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--text-primary);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideInRight 0.25s ease;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      .product-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .product-thumb {
        width: 100%;
        height: 190px;
      }
      .product-title {
        padding-right: 0;
      }
      .badge-featured {
        top: 24px;
        right: 24px;
        background: rgba(250, 243, 234, 0.95);
        box-shadow: var(--shadow-sm);
      }
      .product-footer {
        width: 100%;
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Profile Header -->
    <section class="profile-header">
      <div class="avatar-wrapper">
        <div class="avatar">
          <img src="https://thal01veloso.github.io/mari-privado/Capa_Hotmart_600x600.png" alt="Mari" onerror="this.parentElement.innerHTML='<span>M</span>'">
        </div>
      </div>
      <h1 class="profile-title">Links & Produtos da Mari</h1>
      <p class="profile-bio">Seleção especial dos produtos exclusivos e conteúdos da Mari. Clique nos links abaixo para acessar! ✨</p>
    </section>

    <!-- Search and Category Filters -->
    <section class="controls-section">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar produto pelo nome, categoria ou descrição..." oninput="renderProducts()">
      </div>

      <div class="categories-bar" id="categoriesBar">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Static Products List -->
    <section id="productsContainer" class="products-grid">
      <!-- Rendered from static PRODUCTS array below -->
    </section>

    <footer class="page-footer">
      <p>© Links da Mari — Todos os direitos reservados.</p>
    </footer>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    /**
     * LISTA ESTÁTICA DE PRODUTOS DA MARI
     * Para adicionar ou editar links, basta alterar este array diretamente no código.
     */
    const PRODUCTS = [
      {
        id: 'prod-mari-intensa',
        title: 'MARI: A Arte de Ser Intensa — Livro-Ensaio Fotográfico Exclusivo',
        url: 'https://thal01veloso.github.io/mari-privado/',
        price: 'R$ 11,97',
        oldPrice: 'R$ 37,00',
        category: 'Exclusivo da Mari',
        cta: 'Quero Meu Acesso!',
        image: 'https://thal01veloso.github.io/mari-privado/Capa_Hotmart_600x600.png',
        desc: 'Livro-ensaio fotográfico exclusivo da coleção Frases Maduras que celebra o charme, a autoconfiança e a beleza real em estética editorial de luxo.',
        featured: true
      },
      {
        id: 'prod-projeto-babando',
        title: 'Projeto Babando | 30 Dias Para Reacender o Desejo e a Conexão',
        url: 'https://mais-interesse.thalesveloso.com.br/',
        price: 'R$ 47,00',
        oldPrice: '',
        category: 'Relacionamento',
        cta: 'Quero Conhecer!',
        image: 'https://mais-interesse.thalesveloso.com.br/capa%20do%20produto.png',
        desc: 'Um plano prático de 30 dias para sair do automático, criar momentos de conexão e redescobrir a intimidade no relacionamento.',
        featured: true
      }
    ];

    let selectedCategory = 'Todos';

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      const cats = ['Todos', ...new Set(PRODUCTS.map(p => (p.category || 'Geral').trim()).filter(Boolean))];

      bar.innerHTML = cats.map(cat => `
        <button class="cat-chip ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${escapeQuotes(cat)}')">
          ${escapeHtml(cat)}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      const filtered = PRODUCTS.filter(p => {
        const cat = (p.category || 'Geral').trim();
        if (selectedCategory !== 'Todos' && cat !== selectedCategory) return false;
        if (query) {
          const haystack = `${p.title} ${p.desc || ''} ${p.category || ''} ${p.price || ''}`.toLowerCase();
          return haystack.includes(query);
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>Nenhum produto encontrado para essa busca.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(prod => {
        const hasImage = prod.image && prod.image.trim() !== '';
        const thumbContent = hasImage
          ? `<img src="${escapeHtml(prod.image)}" alt="${escapeHtml(prod.title)}" onerror="this.parentElement.innerHTML='<i data-lucide=\\'shopping-bag\\'></i>'; lucide.createIcons();">`
          : `<i data-lucide="shopping-bag"></i>`;

        return `
          <article class="product-card ${prod.featured ? 'featured' : ''}">
            ${prod.featured ? `<span class="badge-featured"><i data-lucide="star" style="width:12px;height:12px;"></i> Destaque</span>` : ''}

            <div class="product-thumb">
              ${thumbContent}
            </div>

            <div class="product-content">
              <div class="product-meta">
                <span class="product-cat">${escapeHtml(prod.category || 'Geral')}</span>
              </div>

              <h2 class="product-title">${escapeHtml(prod.title)}</h2>
              ${prod.desc ? `<p class="product-desc">${escapeHtml(prod.desc)}</p>` : ''}

              <div class="product-footer">
                <div class="price-box">
                  ${prod.price ? `<span class="price-current">${escapeHtml(prod.price)}</span>` : ''}
                  ${prod.oldPrice ? `<span class="price-old">${escapeHtml(prod.oldPrice)}</span>` : ''}
                </div>

                <div class="product-actions">
                  <button class="icon-btn" onclick="copyProductLink('${prod.id}')" title="Copiar link do produto">
                    <i data-lucide="share-2" class="icon-sm"></i>
                  </button>

                  <a href="${escapeHtml(prod.url)}" target="_blank" rel="noopener" class="btn-buy">
                    <span>${escapeHtml(prod.cta || 'Acessar Agora')}</span>
                    <i data-lucide="external-link" class="icon-sm"></i>
                  </a>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    function copyProductLink(id) {
      const prod = PRODUCTS.find(p => p.id === id);
      if (!prod) return;
      navigator.clipboard.writeText(prod.url).then(() => {
        showToast('Link copiado para compartilhar!');
      });
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i data-lucide="check-circle-2" class="icon-sm" style="color:#6ee7b7"></i> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 2500);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeQuotes(str) {
      return String(str ?? '').replace(/'/g, "\\'");
    }

    renderCategories();
    renderProducts();
  </script>
</body>
</html>
